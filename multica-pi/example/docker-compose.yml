name: multica-pi-runtime

services:
  runtime:
    # Prebuilt image published by CI (see README -> Install from ghcr.io);
    # override with MULTICA_RUNTIME_IMAGE or build locally (see README -> Build):
    #   cd multica-pi && docker build -t multica-pi-runtime:latest .
    image: ${MULTICA_RUNTIME_IMAGE:-ghcr.io/z-mor/multica-pi-runtime:latest}
    env_file: .env
    restart: unless-stopped
    # Give the daemon time to deregister runtimes / finish in-flight tasks on stop
    stop_grace_period: 1m
    volumes:
      # Per-task worktrees + shared repo cache (avoids re-cloning on restart)
      - workspaces:/data/workspaces
      # pi agent directory (optional): settings.json / models.json / skills /
      # extensions. Provider keys from .env are usually enough — no config
      # files needed by default. Must be writable (no :ro).
      # - ./pi-agent:/home/agent/.pi/agent
      # Git over SSH (optional): read-only key mount, picked up by entrypoint.sh
      # - ./secrets/id_ed25519:/home/agent/.ssh/id_ed25519:ro
      # Custom CA for self-signed certificates (optional): see .env.example -> TLS
      # - ./secrets/ca.crt:/certs/ca.crt:ro
    # Replicas for `docker compose up -d`; `--scale runtime=N` overrides this.
    deploy:
      replicas: ${MULTICA_RUNTIME_REPLICAS:-2}

volumes:
  workspaces:

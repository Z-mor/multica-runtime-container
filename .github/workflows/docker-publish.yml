# Build and publish the runtime images to ghcr.io.
#
# One matrix entry per runtime image (multica daemon + bundled agent CLI):
#   multica-opencode -> ghcr.io/z-mor/multica-opencode-runtime
#   multica-pi       -> ghcr.io/z-mor/multica-pi-runtime
# Each image is built and published independently with its own tag set.
#
# Tag scheme (per image):
#   push tag vX.Y.Z-N  -> X.Y.Z-N (exact), X.Y.Z (latest packaging for that
#                         multica version), latest
#   push to main       -> <multica>-edge (mutable), sha-<short>
#   pull request       -> build only, no push
#
# X.Y.Z is the multica CLI version pinned via ARG in <matrix.context>/Dockerfile;
# N is the packaging revision. Each job reads the version from its Dockerfile
# (single source of truth) and fails if a release tag references a different one.

name: docker-publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - context: multica-opencode
            image: multica-opencode-runtime
          - context: multica-pi
            image: multica-pi-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract pinned MULTICA_VERSION from Dockerfile
        id: versions
        run: |
          multica_version="$(grep -oP '^ARG MULTICA_VERSION=\K.*' "${{ matrix.context }}/Dockerfile")"
          echo "multica=${multica_version}" >> "$GITHUB_OUTPUT"

      - name: Validate release tag matches Dockerfile pin
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"           # vX.Y.Z-N -> X.Y.Z-N
          multica_part="${tag%-*}"             # X.Y.Z
          if [ "$multica_part" != "${{ steps.versions.outputs.multica }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} references multica ${multica_part}, but ${{ matrix.context }}/Dockerfile pins ${{ steps.versions.outputs.multica }}. Bump ARG MULTICA_VERSION first."
            exit 1
          fi

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/z-mor/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.versions.outputs.multica }}-edge,enable={{is_default_branch}}
            type=sha,format=short,enable={{is_default_branch}}
            type=match,pattern=v(.*),group=1
            type=raw,value=${{ steps.versions.outputs.multica }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build (and push off PRs)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: multica-runtime

services:
  runtime:
    # Build the image first (see README -> Build):
    #   cd multica-opencode && docker build -t multica-runtime:latest .
    # Or point MULTICA_RUNTIME_IMAGE at a registry image.
    image: ${MULTICA_RUNTIME_IMAGE:-multica-runtime:latest}
    env_file: .env
    restart: unless-stopped
    # Give the daemon time to deregister runtimes / finish in-flight tasks on stop
    stop_grace_period: 1m
    volumes:
      # Per-task worktrees + shared repo cache (avoids re-cloning on restart)
      - workspaces:/data/workspaces
      # opencode config: copy opencode.example.json -> opencode.json and edit;
      # picked up by newly spawned tasks, no image rebuild needed
      - ./opencode.json:/home/agent/.config/opencode/opencode.json:ro
      # Git over SSH (optional): read-only key mount, picked up by entrypoint.sh
      # - ./secrets/id_ed25519:/home/agent/.ssh/id_ed25519:ro
    # Replicas for `docker compose up -d`; `--scale runtime=N` overrides this.
    deploy:
      replicas: ${MULTICA_RUNTIME_REPLICAS:-2}

volumes:
  workspaces:
